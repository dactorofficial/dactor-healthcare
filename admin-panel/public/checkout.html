<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening eSewa Secure Checkout...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f8fafc;
      color: #0f172a;
    }
    .card {
      background: #fff;
      padding: 36px 28px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      text-align: center;
      max-width: 380px;
      width: 90%;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top-color: #60bb46;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 20px; margin: 0 0 10px; font-weight: 700; }
    p { font-size: 14px; color: #64748b; margin: 0 0 24px; line-height: 1.5; }
    .btn {
      background: #60bb46;
      color: #fff;
      border: none;
      padding: 13px 28px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover { background: #4ea836; }
    .error-box {
      display: none;
      background: #fef2f2;
      color: #dc2626;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 14px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h2 id="heading">Connecting to eSewa</h2>
    <p id="subtext">Please wait while we transfer you to secure payment...</p>
    <div id="errorBox" class="error-box"></div>
    <form id="esewaForm" method="POST" action="">
      <div id="formFields"></div>
      <noscript>
        <button type="submit" class="btn">Continue to eSewa</button>
      </noscript>
    </form>
    <button id="manualBtn" class="btn" style="display:none;" onclick="document.getElementById('esewaForm').submit()">
      Continue to eSewa
    </button>
  </div>

  <script>
    async function loadAndSubmit() {
      const params = new URLSearchParams(window.location.search);
      const attemptId = params.get('attempt_id');
      const returnUrl = params.get('return_url');
      const heading = document.getElementById('heading');
      const subtext = document.getElementById('subtext');
      const spinner = document.getElementById('spinner');
      const errorBox = document.getElementById('errorBox');
      const manualBtn = document.getElementById('manualBtn');
      const form = document.getElementById('esewaForm');
      const fieldsDiv = document.getElementById('formFields');

      if (!attemptId) {
        spinner.style.display = 'none';
        heading.textContent = 'Invalid Payment Request';
        subtext.textContent = 'No payment session ID was provided. Please return to the app and retry.';
        return;
      }

      const baseFnUrl = 'https://ojfoofojcpabqegxmsab.supabase.co/functions/v1/appointment-payment';
      const buildFnUrl = (actionName) => {
        const u = new URL(baseFnUrl);
        u.searchParams.set('action', actionName);
        u.searchParams.set('attempt_id', attemptId);
        if (returnUrl) u.searchParams.set('return_url', returnUrl);
        return u.toString();
      };

      const tryHtmlFormSubmit = (htmlText) => {
        const actionMatch = htmlText.match(/action="([^"]+)"/i);
        if (!actionMatch) return false;

        const inputMatches = [...htmlText.matchAll(/<input[^>]+type="hidden"[^>]+name="([^"]+)"[^>]+value="([^"]*)"/gi)];
        if (inputMatches.length === 0) return false;

        form.action = actionMatch[1];
        fieldsDiv.innerHTML = '';

        inputMatches.forEach(m => {
          const inp = document.createElement('input');
          inp.type = 'hidden';
          inp.name = m[1];
          let val = m[2];
          val = val.replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&lt;/g, '<').replace(/&gt;/g, '>');
          inp.value = val;
          fieldsDiv.appendChild(inp);
        });

        form.submit();

        setTimeout(() => {
          spinner.style.display = 'none';
          manualBtn.style.display = 'inline-block';
          subtext.textContent = 'If you are not redirected automatically, tap below:';
        }, 2500);
        return true;
      };

      const submitJsonPayload = (payload) => {
        if (payload && payload.redirectUrl) {
          window.location.replace(payload.redirectUrl);
          return true;
        }
        if (payload && payload.fields && payload.endpoint) {
          form.action = payload.endpoint;
          fieldsDiv.innerHTML = '';
          Object.entries(payload.fields).forEach(([k, v]) => {
            const inp = document.createElement('input');
            inp.type = 'hidden';
            inp.name = k;
            inp.value = v;
            fieldsDiv.appendChild(inp);
          });
          form.submit();
          setTimeout(() => {
            spinner.style.display = 'none';
            manualBtn.style.display = 'inline-block';
            subtext.textContent = 'If you are not redirected automatically, tap below:';
          }, 2500);
          return true;
        }
        return false;
      };

      try {
        // 1. Primary path: fetch structured form payload (works with current Edge Function)
        const res = await fetch(buildFnUrl('get_form_payload'));
        const text = await res.text();

        let parsedJson = null;
        try {
          parsedJson = JSON.parse(text);
        } catch (_) {}

        if (res.ok && submitJsonPayload(parsedJson)) return;
        if (res.ok && tryHtmlFormSubmit(text)) return;

        // Session definitively completed, missing, or gateway config incomplete
        if (res.status === 404 || res.status === 409) {
          throw new Error(
            (parsedJson && parsedJson.error) ||
            'Payment session is invalid or already completed. Please return to the app and choose Pay at Desk or start a new payment.'
          );
        }

        // 2. Fallback path: fetch ?action=checkout HTML over CORS (Supabase gateway serves text/html as text/plain CSP,
        //    so we fetch the form markup and auto-submit it from this HTTPS page instead of navigating there directly)
        const fallbackRes = await fetch(buildFnUrl('checkout'));
        const fallbackText = await fallbackRes.text();

        let fallbackJson = null;
        try {
          fallbackJson = JSON.parse(fallbackText);
        } catch (_) {}

        if (fallbackRes.ok && submitJsonPayload(fallbackJson)) return;
        if (fallbackRes.ok && tryHtmlFormSubmit(fallbackText)) return;

        throw new Error(
          (fallbackJson && fallbackJson.error) ||
          (parsedJson && parsedJson.error) ||
          'Payment session is invalid or already completed. Please return to the app and choose Pay at Desk or start a new payment.'
        );
      } catch (err) {
        spinner.style.display = 'none';
        heading.textContent = 'Unable to Load Payment';
        subtext.textContent = 'Payment initialization encountered an issue.';
        errorBox.textContent = err.message || 'Please return to app and retry or select Pay at Desk.';
        errorBox.style.display = 'block';
      }
    }

    window.addEventListener('DOMContentLoaded', loadAndSubmit);
  </script>
</body>
</html>
